[project]
name = "liquid-networks"
version = "1.0.0"
description = "Liquid time-constant networks implementation with PyTorch."
readme = "README.md"
authors = [
    { name = "Samuel Berrien" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "mlflow>=3.17.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
]

[project.scripts]
liquidnetworks = "liquid_networks:__main__.main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 100

[tool.pycln]
all = true

[tool.isort]
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pylint]
good-names-rgxs = "^[_a-z][_a-z0-9]?$"
max-line-length = 120
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-few-public-methods",
]
